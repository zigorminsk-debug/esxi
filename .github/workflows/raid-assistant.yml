name: RAID Assistant build
on:
  push:
    branches: ['arena/**']
    paths: ['raid-assistant/**', '.github/workflows/raid-assistant.yml']
  pull_request:
    paths: ['raid-assistant/**', '.github/workflows/raid-assistant.yml']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  vendor-page-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect official LSA archive for its safe download implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          exec > /tmp/raid-probe-step.log 2>&1
          trap 'python3 -c "import json,base64; print(json.dumps({\"content\":base64.b64encode(open(\"/tmp/raid-probe-step.log\",\"rb\").read()[-12000:]).decode(),\"encoding\":\"base64\"}))" > /tmp/raid-probe-error.json; ERRBLOB=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/raid-probe-error.json --jq .sha); gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=error -f context=vendor-archive-error -f description="$ERRBLOB"' ERR
          curl -fsSL --max-time 120 -D /tmp/vendor-headers -o /tmp/vendor.zip 'https://docs.broadcom.com/docs-and-downloads/008.018.012.000_MR_7.38_LSA_ESXi.zip'
          python3 - <<'PY'
          import zipfile, hashlib, json, io
          p = '/tmp/vendor.zip'
          with open(p, 'rb') as f:
              raw = f.read()
          result = {'size': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'headers': open('/tmp/vendor-headers').read(), 'entries': []}
          def walk(z, depth=0):
              for i in z.infolist():
                  result['entries'].append({'name': i.filename, 'size': i.file_size})
                  if i.filename.lower().endswith('.vib') and i.file_size < 100_000_000:
                      data = z.read(i)
                      result['entries'][-1].update({'sha256': hashlib.sha256(data).hexdigest(), 'magic': data[:12].hex()})
                  if depth < 2 and i.filename.lower().endswith('.zip') and i.file_size < 100_000_000:
                      try:
                          walk(zipfile.ZipFile(io.BytesIO(z.read(i))), depth+1)
                      except zipfile.BadZipFile:
                          pass
          walk(zipfile.ZipFile(io.BytesIO(raw)))
          open('/tmp/vendor-results.json','w').write(json.dumps(result, indent=2))
          PY
          python3 -c "import json,base64; print(json.dumps({'content':base64.b64encode(open('/tmp/vendor-results.json','rb').read()).decode(),'encoding':'base64'}))" > /tmp/vendor-blob.json
          BLOB=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/vendor-blob.json --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=vendor-archive-review -f description="$BLOB"
