name: RAID Assistant build
on:
  push:
    branches: ['main', 'arena/**']
    paths: ['raid-assistant/**', '.github/workflows/raid-assistant.yml']
  pull_request:
    paths: ['raid-assistant/**', '.github/workflows/raid-assistant.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified 0.2.0 prerelease'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  go-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: raid-assistant
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: raid-assistant/go.mod, cache-dependency-path: raid-assistant/go.sum }
      - run: go test -race ./...
      - run: go test github.com/jchv/go-webview2/internal/raidguard
      - run: go vet ./...
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: raid-assistant
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: raid-assistant/go.mod, cache-dependency-path: raid-assistant/go.sum }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm, cache-dependency-path: raid-assistant/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: go build -o "$RUNNER_TEMP/raid-preview" ./cmd/preview
      - run: npm run test:ui
        env:
          RAID_PREVIEW_EXECUTABLE: ${{ runner.temp }}/raid-preview
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: raid-assistant/go.mod, cache-dependency-path: raid-assistant/go.sum }
      - name: Build portable Windows x64 application
        working-directory: raid-assistant
        shell: pwsh
        run: |
          $env:CGO_ENABLED='0'
          New-Item -ItemType Directory -Force ../raid-build | Out-Null
          go build -trimpath -ldflags '-s -w -H windowsgui' -o ../raid-build/ESXi-RAID-Assistant-0.2.0-windows-x64.exe ./cmd/raid-assistant
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign with the persistent public lab certificate and verify identity
        shell: pwsh
        run: |
          $identity = Get-Content signing/repository/identity.json -Raw | ConvertFrom-Json
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$tool) { throw 'Windows SDK signtool not found' }
          $exe = (Resolve-Path raid-build/ESXi-RAID-Assistant-0.2.0-windows-x64.exe).Path
          & $tool.FullName sign /fd SHA256 /f $identity.windows.certificate /p $identity.windows.password $exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          $sig = Get-AuthenticodeSignature $exe
          if ($null -eq $sig.SignerCertificate -or $sig.SignatureType -ne 'Authenticode') { throw 'EXE not signed' }
          $actual=[BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($sig.SignerCertificate.RawData)).Replace('-','').ToLower()
          $expected=(Get-Content signing/public/windows-certificate.sha256 -Raw).Trim()
          if ($actual -ne $expected) { throw 'Signing certificate pin mismatch' }
      - name: Run WebView2 and native-bridge smoke test on Windows
        shell: pwsh
        run: |
          $env:ESXI_RAID_ASSISTANT_SELFTEST='1'
          $env:ESXI_RAID_ASSISTANT_SELFTEST_TRACE=Join-Path $env:RUNNER_TEMP 'raid-selftest.log'
          $exe = (Resolve-Path raid-build/ESXi-RAID-Assistant-0.2.0-windows-x64.exe).Path
          $p = Start-Process -FilePath $exe -PassThru
          $timedOut = !$p.WaitForExit(60000)
          if ($timedOut) { Stop-Process -Id $p.Id -Force }
          if ($timedOut -or $p.ExitCode -ne 0) {
            if (Test-Path $env:ESXI_RAID_ASSISTANT_SELFTEST_TRACE) { Get-Content $env:ESXI_RAID_ASSISTANT_SELFTEST_TRACE | Write-Host }
            throw "WebView2 bridge self-test failed: timedOut=$timedOut exit=$($p.ExitCode)"
          }
      - name: Generate checksums and release notes
        shell: pwsh
        run: |
          Copy-Item raid-assistant/README.md raid-build/README-RAID-Assistant.md
          Copy-Item raid-assistant/ESXI-8-EXTENSIONS.md raid-build/ESXI-8-EXTENSIONS.md
          Copy-Item signing/public/windows-certificate.sha256 raid-build/
          $file='ESXi-RAID-Assistant-0.2.0-windows-x64.exe'
          $hash=(Get-FileHash "raid-build/$file" -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Set-Content -Encoding ascii raid-build/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raid-assistant-windows-x64
          path: raid-build/*
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [go-tests, browser-tests, windows-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: raid-assistant-windows-x64
          path: release-assets
      - name: Publish separately from Atlas after all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release-assets/ESXi-RAID-Assistant-0.2.0-windows-x64.exe
          test -s release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          gh release create raid-assistant-v0.2.0 release-assets/* \
            --target "$GITHUB_SHA" --title 'ESXi RAID Assistant 0.2.0 (предварительная версия)' \
            --notes-file raid-assistant/RELEASE-NOTES.md --prerelease --latest=false
