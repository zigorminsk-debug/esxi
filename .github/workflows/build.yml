name: Build Android and Windows
on:
  push:
    branches: ['arena/b6265203-esxi']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm test
      - name: Build and sign Windows installer
        env:
          CSC_LINK: ${{ github.workspace }}\signing\windows.p12
          CSC_KEY_PASSWORD: prototype-only-change-for-production
        shell: pwsh
        run: |
          cmd /c "npm run dist:win > build-windows.log 2>&1"
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content build-windows.log | Select-Object -Last 50 | ForEach-Object { Write-Output "::error::$_" } }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-log
          path: build-windows.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Lab-Windows
          path: dist/*.exe
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci
      - run: npm test
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set Android version code
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build and sign APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: prototype-only-change-for-production
          KEY_ALIAS: mikrotik
          KEY_PASSWORD: prototype-only-change-for-production
        run: |
          ./gradlew assembleRelease
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign --ks "$GITHUB_WORKSPACE/signing/android.p12" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/MikroTik-Lab.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify "$RUNNER_TEMP/MikroTik-Lab.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Lab-Android
          path: ${{ runner.temp }}/MikroTik-Lab.apk
